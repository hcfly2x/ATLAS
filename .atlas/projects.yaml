# Esta configuração é seed declarativo. Um projeto só pode mudar de draft para
# active depois de satisfazer activation_required_fields.
schema:
  fields:
    autonomy_level:
      type: integer
      allowed_values: [0, 1, 2, 3, 4]
      default: 2
      level_4_enabled: false
    runtime:
      type: object
      optional: true
      required_fields:
        - package_manager
        - bootstrap
        - validate
        - allowed_commands
        - forbidden_commands
        - timeout_minutes
      description: Runtime declarado por projeto; sem este bloco, o worker mantém a validação legada.

  activation_required_fields:
    - repository
    - allowed_commands
    - data_classification
    - retention

  defaults:
    status: draft
    policy: least_privilege
    autonomy_level: 2
    protected_paths_profile: project_default
    allowed_commands: []
    required_tools:
      node: null
      git: null
      codex_cli: null
      gnu_tools: []
    task_cost_limit_usd: 2
    retention:
      logs_days: 30
      files_days: 30
      sensitive_days: 7
      audit_events_expire: false

projects:
  - id: atlas
    name: ATLAS
    dashboard:
      plan: |-
        ## Motor (bastidores)
        - [x] Confere o trabalho rodando de verdade
        - [x] Revisor independente
        - [x] Reconciliação (só passa com pass + approved)
        - [x] Autonomia proporcional ao risco
        - [x] Entrega garantida (outbox)
        - [x] Anti-loop de retrabalho

        ## Escritório (a dashboard)
        - [x] Fundação e stack
        - [x] Mission Control
        - [x] Workspace + replay
        - [x] Login e segurança
        - [x] Aprovar / rejeitar pela tela
        - [x] Publicar no site
        - [x] Criar + cancelar demanda
        - [x] Pausar / retomar / priorizar
        - [x] Tela Projetos + tema claro
        - [x] Plano + histórico por projeto

        ## Operação (go-live)
        - [ ] Gerir projetos pela web (criar / conectar / ativar)
        - [ ] Mac como servidor + dashboard exposta com segurança
        - [ ] Ativar a Escola do Painel de LED
        - [ ] Ligar o enforcement (hoje só observa)
        - [ ] Primeira demanda real de teste

        ## Objetivo (empresa de agentes)
        - [ ] Operar ATLAS + Escola 100% pela web
        - [ ] Humano nos gates críticos (merge, deploy, pagamento)
        - [ ] Evolução nuvem: repositório por URL + worker hospedado
    status: draft
    risk: critical
    data_classification: internal_sensitive
    policy: self_modification_restricted
    autonomy_level: 3
    repository: null
    protected_paths_profile: atlas
    allowed_commands: []
    required_tools:
      node: null
      git: null
      codex_cli: null
      gnu_tools: []
    task_cost_limit_usd: 2
    retention:
      logs_days: 30
      files_days: 30
      sensitive_days: 7
      audit_events_expire: false

  - id: personal-finance-reconciler
    name: Conciliador Financeiro Pessoal
    status: draft
    risk: high
    data_classification: personal_financial
    autonomy_level: 2
    repository: null

  - id: course-platform
    name: Plataforma de Curso
    status: draft
    risk: high
    data_classification: commercial_sensitive
    autonomy_level: 2
    repository: null
    integrations:
      - mercado_pago
      - meta_pixel
      - google_tag_manager
      - analytics

  - id: marketing-operations
    name: Marketing Operations
    status: future
    risk: high
    data_classification: commercial_sensitive
    autonomy_level: 2
    repository: null
