# Esta configuração é seed declarativo. Um projeto só pode mudar de draft para
# active depois de satisfazer activation_required_fields.
schema:
  fields:
    autonomy_level:
      type: integer
      allowed_values: [0, 1, 2, 3, 4]
      default: 2
      level_4_enabled: false

  activation_required_fields:
    - repository
    - data_classification
    - policy
    - autonomy_level
    - protected_paths_profile
    - allowed_commands
    - required_tools
    - task_cost_limit_usd
    - retention

  defaults:
    status: draft
    policy: least_privilege
    autonomy_level: 2
    protected_paths_profile: project_default
    allowed_commands: []
    required_tools:
      node: null
      git: null
      codex_cli: null
      gnu_tools: []
    task_cost_limit_usd: null
    retention:
      logs_days: 30
      files_days: 30
      sensitive_days: null
      audit_events_expire: false

projects:
  - id: atlas
    name: ATLAS
    status: draft
    risk: critical
    data_classification: internal_sensitive
    policy: self_modification_restricted
    autonomy_level: 2
    repository: null
    protected_paths_profile: atlas
    allowed_commands: []
    required_tools:
      node: null
      git: null
      codex_cli: null
      gnu_tools: []
    task_cost_limit_usd: null
    retention:
      logs_days: 30
      files_days: 30
      sensitive_days: 7
      audit_events_expire: false

  - id: personal-finance-reconciler
    name: Conciliador Financeiro Pessoal
    status: draft
    risk: high
    data_classification: personal_financial
    autonomy_level: 2
    repository: null

  - id: course-platform
    name: Plataforma de Curso
    status: draft
    risk: high
    data_classification: commercial_sensitive
    autonomy_level: 2
    repository: null
    integrations:
      - mercado_pago
      - meta_pixel
      - google_tag_manager
      - analytics

  - id: marketing-operations
    name: Marketing Operations
    status: future
